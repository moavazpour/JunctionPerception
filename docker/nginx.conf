server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 4g;     # video uploads
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Optional password protection: tools/set_password.sh writes auth.conf + htpasswd into this directory.
  include /etc/nginx/auth/*.conf;

  location / {
    try_files $uri /index.html;
  }
  # The page must not be cached (its hashed assets can be): a new build is picked up on the next load.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # MQTT over WebSocket, so the panel needs a single port.
  location /mqtt {
    set $broker http://mosquitto:9001;
    proxy_pass $broker;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  # Live camera view (MJPEG) of a site: /live/<site>/video.mjpg -> its runtime container, port 8081.
  # Single-camera stack: the runtime service has the network alias jp-site-<site id>.
  location ~ ^/live/([a-z0-9-]+)/(.*)$ {
    set $live http://jp-site-$1:8081/$2;
    proxy_pass $live;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Site manager (demo / multi-site stack only; absent in the single-camera stack).
  location /api/ {
    set $manager http://manager:8000;
    proxy_pass $manager;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
  }
}
