# Benchmark scene: camera south1 of the TUMTraf Intersection R02 recordings (S110 gantry).
# Paths are relative to the dataset root (JP_DATA_ROOT).
scene_id: tumtraf_s110_south1
kind: benchmark
image_size_px: [1920, 1200]
source:
  dataset: tumtraf_intersection_r02
  camera: s110_camera_basler_south1_8mm
  sequences: [a9_dataset_r02_s01, a9_dataset_r02_s02, a9_dataset_r02_s03, a9_dataset_r02_s04]
  video_pattern: "{sequence}_s110_camera_basler_south1_8mm.mp4"
# Ground frame: metric plane fitted to the ground-truth boxes seen by this camera, defined in
# the south LiDAR frame of the labels (see ground_homography.yaml). The geo anchor is set once
# the scene is aligned to the map with control points.
calibration: ground_homography.yaml
# Map layers: the ground frame is a sensor frame, not geo-referenced. Set map.anchor (position of
# the south LiDAR on the S110 gantry) in the console's site settings; the map is then rotated into
# this frame by map.transform and can be fine-aligned in the live twin ("Align map").
# yaw_deg: x axis of the south LiDAR in the HD-map frame of the labels (s110_base 90°, LiDAR 77.6°)
# minus the UTM grid convergence at the site (about 2.0°), as a rotation from east-north-up.
map:
  radius_m: 250
  transform: {yaw_deg: -165.6, x_m: 0.0, y_m: 0.0}
  # Position of the S110 gantry, set in the console.
  anchor: {lat_deg: 48.249367, lon_deg: 11.6308, alt_m: 7.0}
