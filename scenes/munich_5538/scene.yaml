# Custom site: a signalized intersection in Munich, filmed from a pedestrian bridge.
# A site is one intersection; each camera has a folder below cameras/ with its image size and
# calibration. Zones (crosswalks) belong to the site and are shared by its cameras.
scene_id: munich_5538
kind: custom
# Origin of the world frame (local east-north-up) of all cameras of the site.
geo_anchor: {lat_deg: 48.1760, lon_deg: 11.5556, alt_m: 512.0}
# Area around the anchor covered by the map layers (tools/prepare_map_data.py).
map:
  radius_m: 300
