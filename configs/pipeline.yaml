# Perception pipeline settings. Paths are relative to the repository root.
detection:
  model: models/yolo26s_1280.onnx  # end-to-end YOLO26 export (tools/export_yolo26.py)
  confidence_threshold: 0.1        # low enough for the tracker's second association stage
  execution_provider: cuda         # cuda (falls back to cpu if unavailable) or cpu
  cuda_device: 0
  class_source: coco               # label source in configs/classes.yaml
  # A person riding a detected bicycle or motorcycle becomes one two-wheeler object.
  rider_association:
    enabled: true
    min_person_overlap: 0.2        # share of the person box overlapping the two-wheeler box
    min_feet_depth: 0.25           # person's feet below this fraction of the two-wheeler height

# ByteTrack in image space.
tracking:
  high_score: 0.5                  # first association stage
  low_score: 0.1                   # second stage: low-score detections to recent tracks
  new_track_score: 0.6             # unmatched detections from this score start a track
  high_match_min_iou: 0.2
  low_match_min_iou: 0.5
  tentative_match_min_iou: 0.3
  confirm_frames: 3                # consecutive matches before a track gets an ID
  max_missed_frames: 15            # frames without a match before a track is dropped
  min_rider_votes: 1.0             # ridden detections (summed scores) to keep a rider's class

# Ground-plane localization.
localization:
  # Visible contact point (box bottom centre) -> footprint centre: box_fit fits a class-sized
  # box to the detection with the camera model, ray_offset shifts along the camera ray by the
  # class footprint, none keeps the contact point.
  bias_correction: box_fit
  acceleration_std_mps2: 2.0       # process noise of the constant-velocity Kalman filter
  measurement_std_m: 0.3           # position measurement std at the camera
  measurement_std_per_m: 0.01      # added std per metre of distance from the camera
  heading_min_speed_mps: 0.5       # below this speed the last heading is held
  forget_after_s: 5.0

# VRU zones and events.
events:
  crosswalk_min_frames: 3          # VRU_ON_CROSSWALK: frames inside a crosswalk zone to start
  conflict_horizon_s: 3.0          # VRU_VEHICLE_CONFLICT: constant-velocity prediction horizon
  conflict_step_s: 0.1
  conflict_distance_m: 2.0         # predicted VRU-vehicle distance below which a conflict exists
  conflict_min_frames: 2           # frames in conflict to start the event
  end_frames: 3                    # frames without the condition before an event ends
  turning_window_s: 2.0            # a vehicle is turning if its heading changed by more than
  turning_threshold_deg: 20.0      # this over the window
