# Perception pipeline settings. Paths are relative to the repository root.
detection:
  model: models/yolo26s_1280.onnx  # end-to-end YOLO26 export (tools/export_yolo26.py)
  confidence_threshold: 0.1        # low enough for the tracker's second association stage
  execution_provider: cuda         # cuda (falls back to cpu if unavailable) or cpu
  cuda_device: 0
  class_source: coco               # label source in configs/classes.yaml
  # A person riding a detected bicycle or motorcycle becomes one two-wheeler object.
  rider_association:
    enabled: true
    min_person_overlap: 0.2        # share of the person box overlapping the two-wheeler box
    min_feet_depth: 0.25           # person's feet below this fraction of the two-wheeler height

# ByteTrack in image space.
tracking:
  high_score: 0.5                  # first association stage
  low_score: 0.1                   # second stage: low-score detections to recent tracks
  new_track_score: 0.6             # unmatched detections from this score start a track
  high_match_min_iou: 0.2
  low_match_min_iou: 0.5
  tentative_match_min_iou: 0.3
  confirm_frames: 3                # consecutive matches before a track gets an ID
  max_missed_frames: 15            # frames without a match before a track is dropped
  min_rider_votes: 1.0             # ridden detections (summed scores) to keep a rider's class

# Ground-plane localization.
localization:
  # Visible contact point (box bottom centre) -> footprint centre: box_fit fits a class-sized
  # box to the detection with the camera model, ray_offset shifts along the camera ray by the
  # class footprint, none keeps the contact point.
  bias_correction: box_fit
  # Measurement noise: image noise of the box bottom mapped through the homography (large along
  # the camera ray, small across it, growing with range) plus an isotropic floor for the
  # footprint model and the calibration.
  measurement_pixel_std: 2.0
  measurement_floor_std_m: 0.5
  # Process noise of the constant-velocity Kalman filter: white acceleration std per class.
  acceleration_std_mps2: {default: 2.0, pedestrian: 1.0, bicycle: 2.0, motorcycle: 2.0}
  initial_speed_std_mps: 10.0      # velocity std of a new or re-anchored track
  innovation_gate: 18.4            # chi-square (2 dof, 99.99 %) above which a measurement is not fused
  reanchor_after: 3                # rejected frames in a row before the track is re-anchored
  heading_min_speed_mps: 0.5       # below this speed the last heading is held
  forget_after_s: 5.0
  # Keypoint models (four bottom corners of the 3D box): the projected corners give the
  # footprint centre, the heading (from the long side, also of standing objects) and the size;
  # detections without four visible, plausibly sized corners fall back to bias_correction.
  keypoints:
    enabled: true
    min_score: 0.5                 # visibility every corner needs
    min_size_ratio: 0.4            # measured length and width within these factors of the
    max_size_ratio: 2.5            # class size (configs/classes.yaml)
    floor_std_m: 0.6               # isotropic measurement floor of a corner footprint
    smoothing: 0.3                 # weight of a new measurement in heading and size
    heading_when_moving: false     # moving road users keep the heading of their motion
    position: false                # position from the corner centre (else from the box fit)

# VRU zones and events.
events:
  crosswalk_min_frames: 3          # VRU_ON_CROSSWALK: frames inside a crosswalk zone to start
  conflict_horizon_s: 3.0          # VRU_VEHICLE_CONFLICT: constant-velocity prediction horizon
  conflict_step_s: 0.1
  conflict_gap_m: 1.0              # predicted gap between vehicle footprint and VRU below which
                                   # a pair is in conflict
  conflict_min_closing_speed_mps: 0.3  # the gap must shrink at least this fast (not merely close)
  conflict_max_speed_std_mps: 0.5  # velocities less certain than this are not extrapolated
  stopped_speed_mps: 0.5           # vehicle state: stopped below this speed
  starting_window_s: 2.0           # vehicle state: starting when moving within this time of a stop
  # Scenes calibrated from control points: events only where positions are validated, i.e.
  # within this margin of the control points and where one pixel along the camera ray is at
  # most this much ground. Objects elsewhere are tracked and shown, without events.
  validated_margin_m: 10.0
  validated_max_ground_m_per_px: 0.2
  conflict_min_frames: 2           # frames in conflict to start the event
  end_frames: 3                    # frames without the condition before an event ends
  turning_window_s: 2.0            # a vehicle is turning if its heading changed by more than
  turning_threshold_deg: 20.0      # this over the window
