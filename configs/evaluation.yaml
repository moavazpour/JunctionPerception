# Benchmark evaluation (jp_eval): matching of world-state objects to the ground-truth labels.
vehicle_gate_m: 2.0               # largest ground distance for a match with a labelled vehicle
vru_gate_m: 1.0                   # ... with a labelled pedestrian, cyclist or motorcyclist
displaced_gate_m: 5.0             # second pass: a missed label and a false positive this close
                                  # are one object placed too far away ("displaced")
velocity_window_s: 1.0            # label speed and direction from positions over this window
moving_speed_mps: 1.0             # heading errors of labelled vehicles moving at least this fast
range_bins_m: [0, 20, 40, 60, 80, 120]  # distance from the camera
# jp_eval --merge-trailers: a labelled tractor (TRUCK) and the trailer (TRAILER) behind it are one
# truck label, as the camera detector sees one vehicle.
articulated:
  max_gap_m: 2.0                  # tractor rear to trailer front
  max_angle_deg: 30               # between their yaws
