# Test site: Georg-Brauchle-Ring eastbound, approach to Lerchenauer Str. (Munich).
# Camera: handheld phone on the Walther-Bathe-Weg footbridge, looking east.
site:
  id: muc-gbr-lerchenauer
  name: Georg-Brauchle-Ring / Lerchenauer Str.

camera:
  id: cam1
  source: file:///data/videos/IMG_5538.MOV   # any of: file://, rtsp://, usb:N, v4l2://, gst:<pipeline>
  realtime: true
  loop: true
  max_fps: 15
  position:                 # what the installer knows
    lat: 48.175995
    lon: 11.555590
    height_m: 7.0           # "between 6 and 8 m"
    height_sigma: 1.0
    bearing_deg: 95         # rough viewing direction
  # intrinsics:             # optional; estimated automatically when absent
  #   focal_px: 1800
  #   distortion: [k1, k2, p1, p2, k3]

calibration:
  file: /data/state/calibration_cam1.json
  min_duration_s: 45
  publish_snapshot: true    # calibration view only, road users pixelated on device
  # --- generated by tools/osm_site.py from OpenStreetMap ---
  road_bearing_deg: 90.9

map:
  learn_lanes: true
  # Nearest traffic signal of the junction ahead (OSM) = stop line reference.
  stop_line: {lat: 48.1759537, lon: 11.5580265}

models:
  detector: /models/gc3d.onnx
  segmentation: /models/segformer_b2_cityscapes.onnx
  fp16: true
  score_threshold: 0.2
  max_range_m: 250

output:
  topic_prefix: jp
  mqtt:
    uri: tcp://mosquitto:1883
  file: /data/state/metadata_cam1.jsonl
  station_id: 1001
  rates_hz: {objects: 10, cpm: 10, state: 2, health: 1, occlusion: 1}

health:
  target_fps: 15

state_dir: /data/state
