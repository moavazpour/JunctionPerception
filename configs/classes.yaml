# Twin object classes and the labels of each source that map onto them.
#
# length_m / width_m / height_m: fixed size per class, used to fit the object box to its 2D
# detection (ground contact) and for the twin meshes. Length and width of car, truck, bus,
# bicycle and pedestrian are generic priors; van, trailer and emergency_vehicle and all heights
# follow the median TUMTraf R02 box size of the class (two-wheelers including the rider).
# vru: vulnerable road user, considered by the VRU zone and conflict events.
classes:
  car:               {length_m: 4.5,  width_m: 1.8,  height_m: 1.5, vru: false}
  van:               {length_m: 6.0,  width_m: 2.3,  height_m: 2.5, vru: false}
  truck:             {length_m: 8.0,  width_m: 2.5,  height_m: 3.5, vru: false}
  trailer:           {length_m: 10.3, width_m: 2.55, height_m: 3.7, vru: false}
  bus:               {length_m: 12.0, width_m: 2.55, height_m: 3.2, vru: false}
  emergency_vehicle: {length_m: 5.8,  width_m: 2.3,  height_m: 2.0, vru: false}
  motorcycle:        {length_m: 2.1,  width_m: 0.8,  height_m: 1.7, vru: true}
  bicycle:           {length_m: 1.8,  width_m: 0.6,  height_m: 1.7, vru: true}
  pedestrian:        {length_m: 0.5,  width_m: 0.5,  height_m: 1.7, vru: true}
  other:             {length_m: 2.0,  width_m: 1.0,  height_m: 1.5, vru: false}

sources:
  # COCO classes of the pretrained detector; COCO classes not listed here are dropped.
  # COCO has no emergency or special vehicle class: such vehicles are detected as car, truck
  # or bus, and road vehicles without a dedicated twin class (train, e.g. trams) become other.
  coco:
    car: car
    truck: truck
    bus: bus
    motorcycle: motorcycle
    bicycle: bicycle
    person: pedestrian
    train: other
  # TUMTraf Intersection R02 label types.
  tumtraf:
    CAR: car
    VAN: van
    TRUCK: truck
    TRAILER: trailer
    BUS: bus
    EMERGENCY_VEHICLE: emergency_vehicle
    MOTORCYCLE: motorcycle
    BICYCLE: bicycle
    PEDESTRIAN: pedestrian
    OTHER: other
  # Keypoint model (models/jp_pose5_384x640.onnx): five classes, each detection with the four
  # bottom corners of its 3D box. "bike" covers ridden two-wheelers.
  jp_pose5:
    car: car
    pedestrian: pedestrian
    bike: bicycle
    Trucks: truck
    Buses: bus
