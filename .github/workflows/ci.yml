name: ci
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libopencv-dev \
            libeigen3-dev libyaml-cpp-dev nlohmann-json3-dev libspdlog-dev libgtest-dev libpaho-mqtt-dev
      - name: Build (CPU-only, no TensorRT)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJP_WITH_TENSORRT=OFF
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web

  training:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy shapely
      - name: Geometry self-check
        working-directory: training
        run: python -m tools.selfcheck
