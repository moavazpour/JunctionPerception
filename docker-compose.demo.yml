# Multi-site demo stack: the web panel creates sites (uploaded video or RTSP/HTTP stream), the manager
# starts one perception container per site on the GPU, everything publishes to one broker.
#
#   JP_DATA=/abs/path/data JP_MODELS=/abs/path/models docker compose -f docker-compose.demo.yml up -d --build
#   open http://<host>:8080
#
# Requires the runtime image (docker build -t junction-perception:latest -f docker/Dockerfile .) and the
# models (detector ONNX + segmentation ONNX) in JP_MODELS.
name: jp-demo
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.manager
    image: junction-perception-manager:latest
    restart: unless-stopped
    environment:
      JP_DATA_HOST: ${JP_DATA:?set JP_DATA to an absolute path}
      JP_MODELS_HOST: ${JP_MODELS:?set JP_MODELS to an absolute path}
      JP_NETWORK: jp-net
      JP_IMAGE: junction-perception:latest
      JP_DETECTOR: ${JP_DETECTOR:-jp_y26s_v2.onnx}
      JP_MAX_SITES: ${JP_MAX_SITES:-4}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JP_DATA}:/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: junction-perception-web:latest
    restart: unless-stopped
    depends_on: [mosquitto, manager]
    ports:
      - "${JP_PORT:-8080}:80"
    volumes:
      - ${JP_DATA}/auth:/etc/nginx/auth:ro

networks:
  default:
    name: jp-net
