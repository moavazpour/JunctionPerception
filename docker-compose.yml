# Edge stack: perception (one service per camera), MQTT broker, web panel.
#   JP_MODELS=/path/to/models JP_DATA=/path/to/data docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  perception-cam1:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: junction-perception:latest
    restart: unless-stopped
    depends_on: [mosquitto]
    # The panel reaches the live camera view at /live/<site id>/ -> jp-site-<site id>:8081.
    networks:
      default:
        aliases: [jp-site-muc-gbr-lerchenauer]
    command: ["--config", "/config/site.yaml"]
    volumes:
      - ./configs/sites/munich_gbr_lerchenauer.yaml:/config/site.yaml:ro
      - ${JP_MODELS:-./models}:/models
      - ${JP_DATA:-./data}/state:/data/state
      - ${JP_DATA:-./data}/videos:/data/videos:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: junction-perception-web:latest
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "8080:80"
